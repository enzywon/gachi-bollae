name: 기능 제안
description: 새로 있었으면 하는 기능이나 개선 아이디어를 알려 주세요.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 아쉬운가요
      description: 해결하고 싶은 상황을 먼저 적어 주세요. 해결책보다 문제가 먼저입니다.
      placeholder: 추천받은 콘텐츠를 나중에 다시 보려면 매번 처음부터 조건을 고르게 됩니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
      description: 떠오르는 해결 방법이 있다면 적어 주세요. 확실하지 않아도 괜찮습니다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 추천 흐름 (상황·무드·장르 선택)
        - 필터 (재생 시간·형식·OTT)
        - 추천 결과 화면
        - 기록 (선택·넘기기·시청 완료)
        - 그 외
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 다른 방식도 생각해 봤다면 왜 접었는지 적어 주세요.
