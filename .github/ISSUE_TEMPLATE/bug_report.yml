name: 버그 신고
description: 동작이 예상과 다른 부분을 알려 주세요.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        비슷한 이슈가 이미 있는지 먼저 검색해 주시면 도움이 됩니다.

  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 일어났나요
      description: 실제로 관찰한 동작을 적어 주세요.
      placeholder: OTT 필터에서 넷플릭스를 선택해도 결과가 바뀌지 않습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 같은 상황을 다시 만들 수 있는 순서를 적어 주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      placeholder: 선택한 OTT에서 볼 수 있는 콘텐츠만 남아야 합니다.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: 어디에서 확인했나요
      options:
        - 배포된 사이트 (gachi-bollae.vercel.app)
        - PR 프리뷰 URL
        - 로컬 개발 서버 (npm run dev)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 환경
      description: 브라우저와 기기를 적어 주세요.
      placeholder: Chrome 130 / macOS 15, 또는 Safari / iPhone 15

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷이나 콘솔 로그
      description: 있으면 첨부해 주세요. 이미지는 이 칸에 끌어다 놓으면 업로드됩니다.
