name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI 리뷰
    # 포크에서 올라온 PR에는 시크릿이 전달되지 않으므로 건너뛴다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # AI 리뷰어가 작업 트리 안에서 도는 만큼 .git/config 에 토큰을 남기지 않는다.
          persist-credentials: false

      - name: 변경 사항 추출
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          mkdir -p ai-review-out
          base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          git diff "$base_sha" HEAD > ai-review-out/pr.diff
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          if [ ! -s ai-review-out/pr.diff ]; then
            echo "변경 사항이 없어 리뷰를 건너뜁니다."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      # Codex는 CI가 아니라 OpenAI 서버에서 돈다. 여기서는 리뷰를 요청만 하고,
      # 결과는 아래에서 GitHub API로 걷어온다. 이러면 ChatGPT 구독으로 커버되어
      # API 크레딧을 쓰지 않는다.
      - name: Codex 리뷰 요청
        id: codex-request
        if: steps.diff.outputs.empty == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # secrets 컨텍스트는 스텝 if 에서 못 쓰므로 여기서 확인한다.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ENZY_WON_CODEX_REVIEW_TOKEN 이 없어 Codex 리뷰 요청을 건너뜁니다."
            exit 0
          fi
          comment_id=$(gh api --method POST \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --raw-field body='@codex review' --jq '.id')
          echo "comment-id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "Codex 리뷰를 요청했습니다. (코멘트 $comment_id)"

      - name: CodeRabbit CLI 설치
        id: coderabbit-install
        if: steps.diff.outputs.empty == 'false'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: CodeRabbit 리뷰
        id: coderabbit
        if: steps.diff.outputs.empty == 'false' && steps.coderabbit-install.outcome == 'success'
        continue-on-error: true
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          coderabbit auth login --api-key "$CODERABBIT_API_KEY"
          coderabbit review --agent --base "origin/$BASE_REF" > ai-review-out/coderabbit.jsonl

      - name: Node.js 설정
        if: steps.diff.outputs.empty == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # CodeRabbit 리뷰가 도는 동안 Codex App도 병렬로 리뷰하고 있다.
      # 여기서 App이 끝나기를 기다렸다가 결과를 걷어온다.
      - name: Codex 결과 수확
        id: codex
        if: steps.diff.outputs.empty == 'false' && steps.codex-request.outputs.comment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/ai-review/harvest-codex.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --trigger-comment-id "${{ steps.codex-request.outputs.comment-id }}" \
            --timeout 600 \
            --out ai-review-out/codex.json \
            --ids-out ai-review-out/codex-node-ids.txt

      # 요청 코멘트는 역할을 다했으므로 지워서 PR 대화를 깨끗하게 둔다.
      - name: Codex 요청 코멘트 정리
        if: always() && steps.codex-request.outputs.comment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/${REPOSITORY}/issues/comments/${{ steps.codex-request.outputs.comment-id }}"

      # 리뷰어 출력 파싱이 어긋났을 때 원본을 봐야 원인을 알 수 있다.
      - name: 리뷰어 원본 출력 진단
        if: always() && steps.diff.outputs.empty == 'false'
        shell: bash
        run: |
          for file in ai-review-out/codex.json ai-review-out/coderabbit.jsonl; do
            if [ -s "$file" ]; then
              echo "--- $file ($(wc -c < "$file") bytes) ---"
              head -c 3000 "$file"
              echo
            else
              echo "--- $file: 비어 있거나 없음 ---"
            fi
          done

      - name: 리뷰어 원본 출력 업로드
        if: always() && steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-raw
          path: ai-review-out/
          retention-days: 7
          if-no-files-found: warn

      - name: 리뷰 코멘트 작성
        id: post
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/ai-review/post-review.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --status "codex=${{ steps.codex.outcome }},coderabbit=${{ steps.coderabbit.outcome }}" \
            codex=ai-review-out/codex.json \
            coderabbit=ai-review-out/coderabbit.jsonl

      # 통합 코멘트가 올라간 뒤에만 접는다. 순서가 뒤바뀌면 리뷰가 사라진 것처럼 보인다.
      - name: Codex 원본 코멘트 접기
        if: steps.post.outcome == 'success' && steps.codex.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ai-review/hide-comments.mjs ai-review-out/codex-node-ids.txt
