name: AI Review

on:
  # 쓰기 토큰과 개인 PAT를 사용하는 워크플로이므로 PR head의 YAML이나 스크립트를
  # 실행하면 안 된다. pull_request_target은 워크플로 전체를 기본 브랜치 기준으로
  # 실행한다. PR head는 아래에서 diff 계산용 Git 객체로만 가져온다.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  # PR 대화 코멘트는 이슈 코멘트로 취급된다. 요청 코멘트를 달고 지우는 데 필요하다.
  issues: write
  # CodeRabbit 완료 판정은 커밋 상태 조회에 기댄다. 공개 저장소라 지금은 이 권한이
  # 없어도 읽히지만, 비공개로 돌리는 순간 조회가 막히고 조용히 타임아웃까지 기다린다.
  statuses: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # 우리가 단 요청 코멘트임을 알리는 표식. 취소된 실행이 남긴 것까지 찾아 지우는 데 쓴다.
  # 사람이 손으로 남긴 요청에는 이 표식이 없으므로 지우지 않는다.
  REQUEST_MARKER: '<!-- ai-review-request -->'

jobs:
  review:
    name: AI 리뷰
    # 포크에서 올라온 PR에는 시크릿이 전달되지 않으므로 건너뛴다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # 이후 PR head 객체를 가져오더라도 자격 증명이 Git 설정에 남지 않게 한다.
          persist-credentials: false

      # untrusted PR head는 checkout하거나 그 안의 스크립트를 실행하지 않는다. GitHub의
      # pull ref를 객체로만 가져오고 이벤트가 알려 준 SHA와 일치하는지 확인한 뒤 diff에만
      # 사용한다. 이후 모든 shell/node 스크립트는 위에서 checkout한 base 버전이다.
      - name: 변경 여부 확인
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          mkdir -p ai-review-out
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          fetched_head=$(git rev-parse FETCH_HEAD)
          if [ "$fetched_head" != "$HEAD_SHA" ]; then
            echo "가져온 PR head가 이벤트 SHA와 일치하지 않습니다." >&2
            exit 1
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA"; then
            echo "변경 사항이 없어 리뷰를 건너뜁니다."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      # 평소에는 CodeRabbit 하나만 돌린다. 리뷰에 특화된 쪽이고, 리뷰어를 늘리면
      # 그만큼 실행이 길어지는 데다 삭제 API 가 없는 리뷰 본문이 리뷰어 수만큼
      # 회색 줄로 남는다. Codex 는 이 요청이 실패했을 때만 아래에서 부른다.
      - name: CodeRabbit 리뷰 요청
        id: request
        if: steps.diff.outputs.empty == 'false'
        continue-on-error: true
        env:
          USER_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_MARKER: ${{ env.REQUEST_MARKER }}
        shell: bash
        run: |
          bash scripts/ai-review/request-review.sh coderabbit '@coderabbitai review' no

      # diff가 비어도 지난 실행의 통합 코멘트를 정리해야 하므로 조건 없이 깐다.
      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # CodeRabbit 은 auto_review 를 꺼 두어 요청 없이는 리뷰하지 않는다. 요청을 못
      # 보냈으면 기다릴 이유가 없으므로 아예 건너뛴다. 그 경우 아래 Codex 폴백이 받는다.
      - name: CodeRabbit 결과 수확
        id: coderabbit
        if: steps.diff.outputs.empty == 'false' && steps.request.outputs.coderabbit-comment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/ai-review/harvest.mjs --source coderabbit \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --trigger-comment-id "${{ steps.request.outputs.coderabbit-comment-id }}" \
            --timeout "${{ steps.request.outputs.coderabbit-comment-id != '' && 600 || 120 }}" \
            --out ai-review-out/coderabbit.json \
            --ids-out ai-review-out/coderabbit-node-ids.txt \
            --delete-ids-out ai-review-out/coderabbit-delete-ids.txt \
            --issue-delete-ids-out ai-review-out/coderabbit-issue-delete-ids.txt

      # CodeRabbit 이 리뷰를 못 남긴 실행은 리뷰가 통째로 없는 실행이다. 할당량, 요청
      # 실패, 타임아웃 어느 쪽이든 결과는 같으므로 사유를 가리지 않고 Codex 로 넘긴다.
      #
      # 요청을 미리 깔아두지 않고 여기서 하는 탓에 두 리뷰는 병렬이 아니라 직렬이 된다.
      # 최악의 경우 CodeRabbit 타임아웃 600초 + Codex 600초로 20분이 걸린다. job
      # timeout 30분 안에는 들어오지만 여유가 크지는 않다. 평소에는 CodeRabbit 만
      # 돌아 이 경로를 타지 않는 것을 전제로 한 값이다.
      - name: Codex 리뷰 요청 (CodeRabbit 실패 시)
        id: codex-request
        if: steps.diff.outputs.empty == 'false' && steps.coderabbit.outcome != 'success'
        continue-on-error: true
        env:
          USER_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_MARKER: ${{ env.REQUEST_MARKER }}
        shell: bash
        run: |
          echo "CodeRabbit 결과: ${{ steps.coderabbit.outcome }}. Codex 로 넘깁니다."
          bash scripts/ai-review/request-review.sh codex '@codex review' yes

      # 요청을 못 보냈으면 리뷰가 올 근거가 없으므로 건너뛴다. 통합 코멘트에는
      # 두 리뷰어 모두 실패한 것으로 남는다.
      - name: Codex 결과 수확
        id: codex
        if: steps.codex-request.outputs.codex-comment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/ai-review/harvest.mjs --source codex \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --trigger-comment-id "${{ steps.codex-request.outputs.codex-comment-id }}" \
            --timeout 600 \
            --out ai-review-out/codex.json \
            --ids-out ai-review-out/codex-node-ids.txt \
            --delete-ids-out ai-review-out/codex-delete-ids.txt \
            --issue-delete-ids-out ai-review-out/codex-issue-delete-ids.txt

      # 요청 코멘트는 역할을 다했으므로 지워서 PR 대화를 깨끗하게 둔다.
      # 이번 실행이 단 것만 지우면 부족하다. 요청을 올린 뒤 다음 push 로 실행이 취소되면
      # 그 코멘트는 어느 실행도 치우지 않아 PR 에 영영 쌓인다. 표식이 붙은 코멘트를 모두
      # 찾아 지운다. 사람이 손으로 남긴 요청에는 표식이 없으므로 건드리지 않는다.
      - name: 요청 코멘트 정리
        if: always()
        continue-on-error: true
        env:
          USER_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_MARKER: ${{ env.REQUEST_MARKER }}
        shell: bash
        run: |
          # gh api 는 jq 의 --arg 를 받지 않는다. 표식은 우리가 정한 고정 문자열이고
          # 따옴표가 없으므로 필터에 그대로 끼워 넣어도 안전하다.
          ids=$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${REQUEST_MARKER}\")) | .id" 2>/dev/null) || ids=""

          for id in $ids; do
            # 누가 달았든 지울 수 있어야 하므로 두 토큰을 차례로 시도한다.
            GH_TOKEN="${USER_TOKEN:-$ACTIONS_TOKEN}" gh api --method DELETE \
              "repos/${REPOSITORY}/issues/comments/$id" 2>/dev/null \
              || GH_TOKEN="$ACTIONS_TOKEN" gh api --method DELETE \
                "repos/${REPOSITORY}/issues/comments/$id" 2>/dev/null \
              || echo "요청 코멘트 $id 를 지우지 못했습니다."
          done

      # 리뷰어 출력 파싱이 어긋났을 때 원본을 봐야 원인을 알 수 있다.
      - name: 리뷰어 원본 출력 진단
        if: always() && steps.diff.outputs.empty == 'false'
        shell: bash
        run: |
          for file in ai-review-out/codex.json ai-review-out/coderabbit.json; do
            if [ -s "$file" ]; then
              echo "--- $file ($(wc -c < "$file") bytes) ---"
              head -c 3000 "$file"
              echo
            else
              echo "--- $file: 비어 있거나 없음 ---"
            fi
          done

      - name: 리뷰어 원본 출력 업로드
        if: always() && steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-raw
          path: ai-review-out/
          retention-days: 7
          if-no-files-found: warn

      # diff가 비어 리뷰를 건너뛴 실행에서도 돌려야 지난 지적이 남아 있지 않다.
      # 그 경우엔 --only-existing 으로 기존 코멘트만 정리하고 새로 달지는 않는다.
      - name: 리뷰 코멘트 작성
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [ "${{ steps.diff.outputs.empty }}" = "true" ]; then
            args+=(--only-existing)
          fi

          # Codex 는 폴백이라 대개 돌지 않는다. 안 돈 리뷰어를 넘기면 통합 코멘트에
          # 매번 "⏭️ 건너뜀" 으로 실려, 쓰지도 않은 리뷰어가 계속 보인다.
          # 판단 기준은 수확 스텝의 outcome 이 아니라 요청 id 다. 폴백을 안 탄 실행에서는
          # 수확이 skip 되는데, skip 된 스텝의 outcome 을 문자열로 비교하는 것보다
          # "요청을 보냈는가" 가 분명하다. 요청만 하고 수확이 실패한 경우도 담아야
          # 통합 코멘트가 둘 다 실패했음을 설명할 수 있다.
          status="coderabbit=${{ steps.coderabbit.outcome }}"
          sources=(coderabbit=ai-review-out/coderabbit.json)
          if [ -n "${{ steps.codex-request.outputs.codex-comment-id }}" ]; then
            status="${status},codex=${{ steps.codex.outcome }}"
            sources+=(codex=ai-review-out/codex.json)
          fi

          node scripts/ai-review/post-review.mjs "${args[@]}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --status "$status" \
            "${sources[@]}"

      # 통합 코멘트가 올라간 뒤에만 치운다. 순서가 뒤바뀌면 리뷰가 사라진 것처럼 보인다.
      #
      # 지울 수 있는 것은 접지 않고 지운다. 접기는 "This comment was marked as outdated."
      # 회색 줄을 남기는데, 인라인은 그 줄이 Files changed 탭에 파일마다 붙고 잡음
      # 코멘트는 애초에 남길 내용이 없다. 지적 원문과 코드 위치 링크는 통합 코멘트가
      # 들고 있으므로 정보는 잃지 않는다.
      #
      # 수확이 실패한 라운드에는 인라인 목록이 비어 있어(harvest 가 실패 경로에서 쓰지
      # 않는다) 인라인은 지워지지 않는다. 통합 코멘트에 지적이 안 실린 채로 원본까지
      # 지우면 리뷰가 통째로 사라진다. 잡음은 그 경우에도 지운다. 사유가 통합 코멘트에
      # 실려 있고, 남겨두면 안내 코멘트가 PR에 쌓여 "코멘트 하나" 가 깨진다.
      #
      # 리뷰어를 꺼도 목록은 그대로 훑는다. 수확이 안 돌면 파일이 없고, 스크립트가
      # 없는 파일은 알아서 넘어간다. 껐다 켜는 사이에 남은 목록만 조용히 치워진다.
      - name: 원본 코멘트 삭제
        if: steps.post.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_TOKEN: ${{ secrets.ENZY_WON_CODEX_REVIEW_TOKEN }}
        shell: bash
        run: |
          for source in codex coderabbit; do
            node scripts/ai-review/delete-comments.mjs --repo "${{ github.repository }}" \
              --kind review "ai-review-out/${source}-delete-ids.txt"
            node scripts/ai-review/delete-comments.mjs --repo "${{ github.repository }}" \
              --kind issue "ai-review-out/${source}-issue-delete-ids.txt"
          done

      # 리뷰 이벤트 본문(CodeRabbit "Actionable comments posted: N", Codex "💡 Codex Review").
      # 벤더 설정으로 못 끄고 삭제 API 도 없어, 여기만 접기로 남는다. PR 대화에
      # 회색 한 줄씩 남는 것이 현재 한계다.
      # 목록 파일이 없거나 비면 hide-comments 가 알아서 넘어간다.
      - name: 리뷰 본문 접기
        if: steps.post.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/ai-review/hide-comments.mjs ai-review-out/codex-node-ids.txt
          node scripts/ai-review/hide-comments.mjs ai-review-out/coderabbit-node-ids.txt
