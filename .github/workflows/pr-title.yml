name: PR title

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits 형식 확인
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?: .{1,72}$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR 제목이 Conventional Commits 형식과 맞지 않습니다."
            echo "예: feat(recommendation): 함께 보기 취향 점수 추가"
            exit 1
          fi
