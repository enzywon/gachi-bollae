# CI에서 CodeRabbit CLI로 리뷰하고 결과를 하나의 PR 코멘트로 합친다.
# 이 파일은 CLI와 앱 양쪽에 적용된다.

language: ko-KR

reviews:
  # walkthrough summary 코멘트를 만드는 항목은 하나만 켜져 있어도 통합 코멘트 옆에
  # CodeRabbit 코멘트가 따로 남는다. 아래는 전부 기본값이 true 라서 명시적으로 꺼야 한다.
  # 인라인 리뷰 코멘트는 그대로 두고(그게 수확 대상이다) 요약 코멘트만 없앤다.
  high_level_summary: false
  review_status: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # 리뷰가 도는 동안 붙는 잡담 코멘트.
  in_progress_fortune: false
  # 수확기가 "CodeRabbit" 커밋 상태의 Review completed 를 완료 신호로 쓴다. 지적이 0건이면
  # 리뷰 객체가 생기지 않아 이것 말고는 완료를 알 방법이 없다. 그런데 commit_status 는
  # 설정 문서상 review_progress 가 꺼져 있을 때만 쓰인다. 기본값에 기대면 언제 끊길지
  # 모르므로 둘 다 명시한다. 코멘트가 아니라 커밋 상태라 PR 대화를 어지럽히지 않는다.
  review_progress: false
  commit_status: true
  auto_review:
    # CI가 draft 여부와 무관하게 @coderabbitai review 로 직접 요청한다.
    # 자동 리뷰까지 켜두면 같은 커밋을 두 번 리뷰해 할당량을 두 배로 쓰고,
    # 인라인 코멘트도 두 벌 생긴다.
    enabled: false
